[project]
name = "spotter-backend"
version = "0.1.0"
description = "Weather-aware truck routing: route, checkpoint and weather-risk API"
readme = "README.md"
authors = [
    { name = "Sangam Pratap Singh", email = "sangampratapsingh21012006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
